<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>hardgfx — present-path isolator</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #c { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Present-path isolator with TUNABLE GPU load, near-zero JS cost (a draw loop,
// microseconds of JS dispatch — nothing like Discord's multi-ms no-JIT macro-
// tasks). The guest rAF fires once per engine bib_tick; each frame damages the
// whole canvas, so the engine must paint+present a full frame per tick. This
// isolates the PRESENT path from JS-bound stalls.
//
//   ?shapes=N : draw N shadow+gradient blobs/frame (heavy GPU paint, MotionMark-
//               like). 0/absent => light animated stripes (max-fps baseline).
//   ?blur=N   : shadowBlur radius for heavy mode (default 18; bigger = heavier).
var c = document.getElementById("c");
function resize() { c.width = window.innerWidth || 1280; c.height = window.innerHeight || 720; }
resize();
window.addEventListener("resize", resize);
var x = c.getContext("2d");
var q = new URLSearchParams(location.search);
var SHAPES = parseInt(q.get("shapes") || "0", 10) || 0;
var BLUR = parseInt(q.get("blur") || "18", 10) || 18;
var t = 0;

// Deterministic pseudo-random so every frame/run is comparable.
function rng(seed) { var s = seed >>> 0; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

function lightFrame(w, h) {
  var STRIPES = 32, sw = w / STRIPES;
  for (var i = 0; i < STRIPES; i++) {
    x.fillStyle = "hsl(" + (((i / STRIPES) * 360 + t * 120) % 360) + ",85%,50%)";
    x.fillRect(i * sw, 0, sw + 1, h);
  }
  var px = (Math.sin(t) * 0.5 + 0.5) * (w - 160), py = (Math.cos(t * 0.7) * 0.5 + 0.5) * (h - 160);
  x.fillStyle = "#fff"; x.fillRect(px, py, 160, 160);
}

function heavyFrame(w, h) {
  // Clear + draw SHAPES shadowed radial-gradient blobs that drift — the kind of
  // per-pixel compositing MotionMark hammers. Whole-frame damage every tick.
  x.clearRect(0, 0, w, h);
  x.fillStyle = "#0a0a14"; x.fillRect(0, 0, w, h);
  var r = rng(1234);
  for (var i = 0; i < SHAPES; i++) {
    var bx = (r() * 1.2 - 0.1) * w + Math.sin(t + i) * 40;
    var by = (r() * 1.2 - 0.1) * h + Math.cos(t * 1.3 + i) * 40;
    var rad = 18 + r() * 46;
    var hue = (r() * 360 + t * 60) % 360;
    var g = x.createRadialGradient(bx, by, 1, bx, by, rad);
    g.addColorStop(0, "hsla(" + hue + ",90%,65%,0.95)");
    g.addColorStop(1, "hsla(" + ((hue + 60) % 360) + ",90%,45%,0)");
    x.shadowColor = "hsla(" + hue + ",90%,60%,0.8)";
    x.shadowBlur = BLUR;
    x.fillStyle = g;
    x.beginPath(); x.arc(bx, by, rad, 0, 6.2832); x.fill();
  }
  x.shadowBlur = 0;
}

function frame() {
  t += 0.02;
  var w = c.width, h = c.height;
  if (SHAPES > 0) heavyFrame(w, h); else lightFrame(w, h);
  x.fillStyle = SHAPES > 0 ? "#fff" : "#000";
  x.font = "20px sans-serif";
  x.fillText("f=" + (window.__hf = (window.__hf | 0) + 1) + " shapes=" + SHAPES, 12, 28);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
