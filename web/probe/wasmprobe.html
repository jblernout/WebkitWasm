<!DOCTYPE html>
<!-- Guest-side WebAssembly polyfill probe (shim epic S-A, gate9).
     Runs INSIDE the engine; results leave via the guest console forwarder.
     Each check logs "WASMPROBE: <name> PASS|FAIL", then a final
     "WASMPROBE-VERDICT: PASS|FAIL". -->
<html>
<head><title>wasmprobe</title></head>
<body>
<h1>wasm polyfill probe</h1>
<script>
(async function () {
  var failures = 0;
  function check(name, ok, detail) {
    if (!ok) failures++;
    console.log("WASMPROBE: " + name + " " + (ok ? "PASS" : "FAIL") + (detail ? " " + detail : ""));
  }

  // Discord's real wasmSupported probe module: test(p) stores 1 at p, loads it back.
  var PROBE = new Uint8Array([0,97,115,109,1,0,0,0,1,6,1,96,1,127,1,127,3,2,1,0,5,3,1,0,1,7,8,1,4,116,101,115,116,0,0,10,16,1,14,0,32,0,65,1,54,2,0,32,0,40,2,0,11]);
  // imports env.add; run() = add(3,4)
  var IMPORT_MOD = new Uint8Array([0,97,115,109,1,0,0,0,1,11,2,96,2,127,127,1,127,96,0,1,127,2,11,1,3,101,110,118,3,97,100,100,0,0,3,2,1,1,7,7,1,3,114,117,110,0,1,10,10,1,8,0,65,3,65,4,16,0,11]);
  // exports memory "mem" + poke(addr, val)
  var MEM_MOD = new Uint8Array([0,97,115,109,1,0,0,0,1,6,1,96,2,127,127,0,3,2,1,0,5,3,1,0,1,7,14,2,3,109,101,109,2,0,4,112,111,107,101,0,0,10,11,1,9,0,32,0,32,1,54,2,0,11]);

  try {
    check("typeof", typeof WebAssembly === "object" && WebAssembly !== null, "typeof=" + typeof WebAssembly);
    if (typeof WebAssembly !== "object" || WebAssembly === null)
      throw new Error("no WebAssembly global — remaining checks pointless");

    check("classes", ["Module", "Instance", "Memory", "Table", "CompileError", "LinkError", "RuntimeError"]
      .every(function (n) { return typeof WebAssembly[n] === "function"; }));
    check("exception-presence", typeof WebAssembly.Exception !== "undefined");

    check("validate-good", WebAssembly.validate(PROBE) === true);
    check("validate-bad", WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,99,99,99])) === false);

    // The exact sync sequence Discord's wasmSupported runs.
    var m = new WebAssembly.Module(PROBE);
    var inst = new WebAssembly.Instance(m, {});
    check("sync-discord-probe", inst.exports.test(4) === 1, "test(4)=" + inst.exports.test(4));

    var r1 = await WebAssembly.instantiate(IMPORT_MOD, { env: { add: function (a, b) { return a + b; } } });
    check("async-import", r1.instance.exports.run() === 7, "run()=" + r1.instance.exports.run());
    check("async-shape", r1.module instanceof WebAssembly.Module && r1.instance instanceof WebAssembly.Instance);

    var r2 = await WebAssembly.instantiate(MEM_MOD, {});
    r2.instance.exports.poke(16, 42);
    var view = new DataView(r2.instance.exports.mem.buffer);
    check("exported-memory", view.getUint32(16, true) === 42);

    var mem = new WebAssembly.Memory({ initial: 1, maximum: 4 });
    var oldPages = mem.grow(1);
    check("memory-class", oldPages === 1 && mem.buffer.byteLength === 2 * 65536);

    var rejected = false;
    await WebAssembly.instantiate(new Uint8Array([1, 2, 3]), {}).catch(function (e) {
      rejected = e instanceof WebAssembly.CompileError || e instanceof Error;
    });
    check("bad-bytes-reject", rejected);

    // Streaming path: fetch rides the engine's curl->wisp network stack.
    var streamed = await WebAssembly.instantiateStreaming(fetch("probe-test.wasm"), {});
    check("streaming", streamed.instance.exports.test(8) === 1);
  } catch (e) {
    failures++;
    console.log("WASMPROBE: unhandled FAIL " + e);
  }
  console.log("WASMPROBE-VERDICT: " + (failures ? "FAIL(" + failures + ")" : "PASS"));
})();
</script>
</body>
</html>
