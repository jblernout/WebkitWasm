<!DOCTYPE html>
<!-- In-guest probe: does window↔iframe postMessage deliver structured-clone
     data intact? Discord's PostMessageTransport routeEvent requires
     Array.isArray(e.data) — our engine logs "Protocol error: event data
     should be an Array!" ×10 on their login page, suggesting the handshake
     payload arrives mangled (string? wrapper object?) and the boot sequence
     stalls. Run: browser.html?url=http://localhost:8080/probe/pmprobe.html -->
<html>
<head><meta charset="utf-8"><title>postMessage probe</title></head>
<body>
<h1>postMessage probe</h1>
<iframe id="child" src="pmchild.html" style="width:10px;height:10px"></iframe>
<script>
(function () {
  var passes = 0, fails = 0, pending = 3, settled = false;
  function report(name, ok, extra) {
    if (ok) passes++; else fails++;
    console.log("PMPROBE: " + name + " " + (ok ? "PASS" : "FAIL") + (extra ? " " + extra : ""));
  }
  function done() {
    pending--;
    if (settled || pending > 0) return;
    settled = true;
    console.log("PMPROBE-VERDICT: " + (fails === 0 ? "PASS" : "FAIL") +
      " (" + passes + " pass, " + fails + " fail)");
  }
  setTimeout(function () {
    if (settled) return;
    report("timeout", false, "pending=" + pending);
    pending = 0; done();
  }, 4000);

  // 1+2. Child→parent HANDSHAKE shape, then parent→child→parent echo.
  var sentEcho = false;
  window.addEventListener("message", function (e) {
    if (e.source === window) {
      // 3. Self-postMessage control.
      report("self-array", Array.isArray(e.data) && e.data[0] === "SELF",
        "type=" + typeof e.data);
      done();
      return;
    }
    if (!Array.isArray(e.data)) {
      report("child-data-shape", false,
        "type=" + typeof e.data + " value=" + String(e.data).slice(0, 80));
      done();
      return;
    }
    if (e.data[0] === "HANDSHAKE") {
      report("child-handshake-array", true,
        "payload.nonce=" + (e.data[1] && e.data[1].nonce) +
        " source=" + (e.source != null) + " origin=" + e.origin);
      report("handshake-payload-object",
        typeof e.data[1] === "object" && e.data[1] !== null && e.data[1].nonce === 42);
      done();
      if (!sentEcho) {
        sentEcho = true;
        document.getElementById("child").contentWindow.postMessage(["PING", { x: 1 }], "*");
      }
    } else if (e.data[0] === "ECHO") {
      var r = e.data[1];
      report("parent-to-child-array", r.isArray === true,
        "childSaw type=" + r.type + " opcode=" + r.opcode +
        " source=" + r.hasSource + " origin=" + r.origin);
      done();
    }
  });

  window.postMessage(["SELF", {}], "*");

  // 4. MessageChannel ports (transports also ride ports).
  pending++;
  var mc = new MessageChannel();
  mc.port1.onmessage = function (e) {
    report("messagechannel-array", Array.isArray(e.data) && e.data[1].y === 2,
      "type=" + typeof e.data);
    done();
  };
  mc.port2.postMessage(["PORT", { y: 2 }]);
})();
</script>
</body>
</html>
